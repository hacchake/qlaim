<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QLAIM ─ 陣取りアーケード</title>
<style>
  html,body{
    margin:0; padding:0; height:100%;
    background:radial-gradient(ellipse at 50% 30%, #101528 0%, #05060d 70%);
    overflow:hidden; touch-action:none;
    font-family:'Courier New', monospace;
  }
  #wrap{
    height:100%; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:8px;
  }
  #game{
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    background:#04050d;
    box-shadow:0 0 40px rgba(60,90,255,.20), 0 0 5px rgba(255,255,255,.16);
  }
  /* 走査線(CRT効果 ON のときだけ) */
  body.crt::after{
    content:''; position:fixed; inset:0; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.15) 0 1px, transparent 1px 3px);
    mix-blend-mode:multiply;
  }
  /* ---- タッチ操作パッド(粗ポインタ端末のみ表示) ---- */
  #pad{
    display:none; width:100%; max-width:480px;
    justify-content:space-between; align-items:center;
    padding:4px 16px 14px; box-sizing:border-box;
    user-select:none; -webkit-user-select:none;
  }
  @media (pointer:coarse){ #pad{ display:flex; } }
  #dpad{ display:grid; grid-template-columns:repeat(3,56px); grid-template-rows:repeat(3,56px); gap:5px; }
  .pb,.ab{
    border:1px solid #3a4a7a; border-radius:10px;
    background:rgba(30,40,80,.55); color:#cdd8ff;
    font:bold 19px 'Courier New',monospace;
    touch-action:none; -webkit-tap-highlight-color:transparent;
  }
  .pb:active,.ab:active{ background:rgba(90,120,220,.7); }
  .ghost{ visibility:hidden; }
  #acts{ display:flex; gap:14px; }
  .ab{ width:76px; height:76px; border-radius:50%; font-size:14px; line-height:1.2; }
  #b-slow{ border-color:#a8632a; color:#ffcf9e; }
  #b-fast{ border-color:#2e86ab; color:#a8e4ff; }
  .ab small{ font-size:10px; opacity:.8; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="640" height="856"></canvas>
  <div id="pad">
    <div id="dpad">
      <button class="pb ghost"></button><button class="pb" id="b-up">▲</button><button class="pb ghost"></button>
      <button class="pb" id="b-left">◀</button><button class="pb ghost"></button><button class="pb" id="b-right">▶</button>
      <button class="pb ghost"></button><button class="pb" id="b-down">▼</button><button class="pb ghost"></button>
    </div>
    <div id="acts">
      <button class="ab" id="b-slow">SLOW<br><small>×2点</small></button>
      <button class="ab" id="b-fast">FAST</button>
    </div>
  </div>
</div>

/* =====================================================================
   QLAIM v3 ─ Qix風 陣取りアーケード (単一HTML / 依存なし / WebAudio合成)

   ルール:
   ・線の上を移動し、Z(速い/×1点) か X(遅い/×2点) を押しながら
     空き地に線を引く。線が閉じると QIX のいない側が塗り潰される
   ・目標占領率でエリアクリア。AREA 3 からは QIX が2体になり、
     線で「分断」すると即クリア + SPLITボーナス
   ・QIXが線に触れる / SPARXに触れる / 導火線に追いつかれる → ミス
   ・描画中に立ち止まると導火線に点火。動けば止まり、止まると迫る

   v3 の新要素: 盤面(サーフェス)
   ・平面(PLANE) … 従来どおりの長方形フィールド
   ・立方体(CUBE) / 球(SPHERE) … 立体の「表面」で陣取り。
     最初は小さな陣地(HOME)だけがあり、その縁から線を引いて広げる。
     カメラは自機を追いかけて回り込み、方向キーは常に「画面上の向き」
   ・TOUR … 平面 → 立方体 → 球 の順にエリアが巡る

   ── カスタマイズ ────────────────────────────
   ・数値バランス      → すぐ下の CONFIG(盤面ごとの値は CONFIG.SURF)
   ・難易度プリセット  → DIFFS
   ・配色テーマ        → THEMES(ゲーム内OPTIONSで切替可)
   ・BGMの譜面         → BGMDATA(音名で書けます。'A2' 'G#4' など)
   ・ゲーム内OPTIONS   → 音量 / 難易度 / 残機 / テーマ / CRT効果
     (設定とハイスコアは localStorage が使える環境なら自動保存。
      使えない環境ではセッション内のみ保持)
===================================================================== */

    { t:'n', w:'square',   v:0.085,g:0.8, l:0, s:[

      'A#3','D4','F4','A#4','F4','D4','A#3','D4', 'A#3','D4','F4','A#4','F4','D4','A#3','D4',

/* ---------------- 定数・ユーティリティ ---------------- */
const GW = CONFIG.GRID_W, GH = CONFIG.GRID_H, CS = CONFIG.CELL;
const FIELD_Y = CONFIG.HUD_H;
const W = GW * CS, H = FIELD_Y + GH * CS;
const OPEN = 0, WALL = 1, TRAIL = 2;
const HOME_COL = 9;              // colA: 初期陣地(HOME)の色番号
const DIRS4 = [[0,-1],[1,0],[0,1],[-1,0]];
const DIRV = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };
const DIRK = { up:0, right:1, down:2, left:3 };

const idx = (x, y) => y * GW + x;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];

// 色: '#rrggbb' ⇔ [r,g,b]
function rgbOf(hex) { const n = parseInt(hex.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgbStr(c, k) {
  k = k == null ? 1 : k;
  return `rgb(${clamp(c[0] * k | 0, 0, 255)},${clamp(c[1] * k | 0, 0, 255)},${clamp(c[2] * k | 0, 0, 255)})`;
}
function mixRgb(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
// '#rrggbb' を明度倍率で暗く(占領地のディザ用)
function shade(hex, k) { return rgbStr(rgbOf(hex), k); }
// 音名 → 周波数('A4'=440)
function hz(name) {
  const m = /^([A-G])(#?)(-?\d)$/.exec(name);
  if (!m) return 440;
  const base = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 }[m[1]] + (m[2] ? 1 : 0);
  const midi = 12 * (Number(m[3]) + 1) + base;
  return 440 * Math.pow(2, (midi - 69) / 12);
}

// 3Dベクトル([x,y,z] 配列)
const vdot   = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const vcross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const vadd   = (a, b, k) => [a[0] + b[0] * k, a[1] + b[1] * k, a[2] + b[2] * k];
function vnorm(a) { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }

/* ---------------- 設定と保存(localStorage不可なら内部保持) ---------------- */
const store = (() => {
  const mem = {};
  return {
    get(k, d) {
      try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }
      catch (e) { return (k in mem) ? mem[k] : d; }
    },
    set(k, v) {
      try { localStorage.setItem(k, JSON.stringify(v)); }
      catch (e) { mem[k] = v; }
    },
  };
})();

const settings = Object.assign(
  { bgm: 6, sfx: 7, diff: 'NORMAL', lives: CONFIG.LIVES, theme: 0, crt: true, mode: 'TOUR' },
  store.get('qlaim.settings', {})
);
if (!DIFFS[settings.diff]) settings.diff = 'NORMAL';
if (!MODES.includes(settings.mode)) settings.mode = 'TOUR';
settings.theme = clamp(settings.theme | 0, 0, THEMES.length - 1);
function saveSettings() { store.set('qlaim.settings', settings); }
function diff() { return DIFFS[settings.diff]; }
function theme() { return THEMES[settings.theme]; }

const hiScores = Object.assign({ PLANE: store.get('qlaim.hi', 0) | 0 }, store.get('qlaim.hi3', {}));
function hiOf(mode) { return hiScores[mode] | 0; }
function saveHi() {

  hiScores[settings.mode] = hiScore;

}

/* ---------------- キャンバス ---------------- */
const cv = document.getElementById('game');

fieldC.width = GW * CS; fieldC.height = GH * CS;

// ビネット(周辺減光)も一度だけ焼く
const vigC = document.createElement('canvas');
vigC.width = W; vigC.height = H - FIELD_Y;
{
  const g = vigC.getContext('2d');
  const gr = g.createRadialGradient(W/2, (H-FIELD_Y)/2, Math.min(W,H)*0.30, W/2, (H-FIELD_Y)/2, Math.max(W,H)*0.72);
  gr.addColorStop(0, 'rgba(0,0,0,0)');
  gr.addColorStop(1, 'rgba(0,0,0,0.38)');
  g.fillStyle = gr;
  g.fillRect(0, 0, W, H - FIELD_Y);
}

/* ---------------- サウンド (WebAudio合成 / SFX・BGM別バス) ---------------- */
const Snd = (() => {
  let ac = null, master = null, sfxG = null, bgmG = null;
  let hum = null, muted = false, hatBuf = null;

  function ensure() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      master = ac.createGain(); master.connect(ac.destination);
      sfxG = ac.createGain(); sfxG.connect(master);
      bgmG = ac.createGain(); bgmG.connect(master);
      // ハイハット用の短いノイズを1つだけ作って使い回す
      const n = Math.floor(ac.sampleRate * 0.06);
      hatBuf = ac.createBuffer(1, n, ac.sampleRate);
      const d = hatBuf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      applyVols();
      Bgm.onAudioReady();
    }
    if (!ac) return;
    if (ac.state === 'suspended') ac.resume();
  }
  function applyVols() {
    if (!ac) return;
    master.gain.value = muted ? 0 : 0.9;
    sfxG.gain.value = settings.sfx / 10;
    bgmG.gain.value = (settings.bgm / 10) * 0.55;
  }
  function toggleMute() { muted = !muted; applyVols(); return muted; }

  function bus(b) { return b === 'bgm' ? bgmG : sfxG; }
  // 汎用トーン。t0省略時は即時
  function tone(f0, f1, dur, type, vol, delay, b, t0) {
    if (!ac) return;
    type = type || 'square'; vol = vol || 0.12; delay = delay || 0;
    const at = (t0 != null ? t0 : ac.currentTime) + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(Math.max(1, f0), at);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), at + dur);
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol, at + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(g); g.connect(bus(b));
    o.start(at); o.stop(at + dur + 0.05);
  }
  function noise(dur, vol, delay, b) {
    if (!ac) return;
    dur = dur || 0.2; vol = vol || 0.15; delay = delay || 0;
    const at = ac.currentTime + delay;
    const n = Math.floor(ac.sampleRate * dur);
    const buf = ac.createBuffer(1, n, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = ac.createBufferSource(); s.buffer = buf;
    const g = ac.createGain(); g.gain.value = vol;
    s.connect(g); g.connect(bus(b));
    s.start(at);
  }

  /* -- BGM用ドラム(絶対時刻指定) -- */
  function kick(t, v) {
    if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(v, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
    o.connect(g); g.connect(bgmG);
    o.start(t); o.stop(t + 0.16);
  }
  function hat(t, v) {
    if (!ac || !hatBuf) return;
    const s = ac.createBufferSource(); s.buffer = hatBuf;
    const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 6500;
    const g = ac.createGain(); g.gain.value = v;
    s.connect(hp); hp.connect(g); g.connect(bgmG);
    s.start(t);
  }
  function snare(t, v) {
    if (!ac || !hatBuf) return;
    const s = ac.createBufferSource(); s.buffer = hatBuf;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1800;
    const g = ac.createGain();
    g.gain.setValueAtTime(v, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
    s.connect(bp); bp.connect(g); g.connect(bgmG);
    s.start(t);
    tone(190, 120, 0.07, 'triangle', v * 0.7, 0, 'bgm', t);
  }
  // BGMメロディ音(絶対時刻)
  function note(freq, t, dur, wave, vol) {
    if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = wave;
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.012);
    g.gain.setValueAtTime(vol, Math.max(t + 0.012, t + dur - 0.03));
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(bgmG);
    o.start(t); o.stop(t + dur + 0.03);
  }

  /* -- 描画中のハム音(軌跡が伸びるほど音程が上がる) -- */
  function startDraw(slow) {
    if (!ac) return;
    stopDraw();
    hum = ac.createOscillator();
    const g = ac.createGain();
    hum.type = 'triangle';
    hum.frequency.value = slow ? 110 : 170;
    g.gain.value = 0.05;
    hum.connect(g); g.connect(sfxG);
    hum.start();
  }
  function updateDraw(len, slow) {
    if (hum) hum.frequency.value = (slow ? 110 : 170) + Math.min(500, len) * 1.2;
  }
  function stopDraw() {
    if (hum) { try { hum.stop(); } catch (e) {} hum.disconnect(); hum = null; }
  }

  const SCALE = [0, 3, 5, 7, 10, 12, 15, 17]; // ペンタトニック風
  return {
    ensure, applyVols, toggleMute, stopDraw, startDraw, updateDraw,
    note, kick, hat, snare,
    get ac() { return ac; },
    claim(cells, slow) {
      const n = 3 + Math.min(4, Math.floor(cells / 400));
      const base = slow ? 392 : 330;
      for (let i = 0; i < n; i++)
        tone(base * Math.pow(2, SCALE[i] / 12), 0, 0.1, 'square', 0.11, i * 0.055);
    },
    big()    { [587,740,880,1175].forEach((f,i)=>tone(f,f*1.5,0.12,'sawtooth',0.09,0.25+i*0.05)); },
    death()  { tone(500, 60, 0.5, 'sawtooth', 0.18); noise(0.35, 0.18); },
    clear_() { [523,659,784,1046,1318].forEach((f,i)=>tone(f,0,0.16,'square',0.13,i*0.11)); },
    split()  { [440,554,659,880,1108,1318].forEach((f,i)=>tone(f,0,0.14,'sawtooth',0.10,i*0.06)); noise(0.25,0.12,0.05); },
    over()   { [330,262,196,131].forEach((f,i)=>tone(f,0,0.3,'triangle',0.15,i*0.24)); },
    extend() { [784,988,1175,1568].forEach((f,i)=>tone(f,0,0.09,'square',0.13,i*0.07)); },
    sparx()  { tone(1400, 900, 0.12, 'square', 0.09); },
    fuseCr() { noise(0.03, 0.07); },
    ready()  { tone(440, 0, 0.10, 'square', 0.11); tone(660, 0, 0.14, 'square', 0.11, 0.18); },
    blip()   { tone(880, 0, 0.05, 'square', 0.07); },
    select() { tone(660, 990, 0.09, 'square', 0.10); },
  };
})();

/* ---------------- BGMシーケンサ(先読みスケジューリング) ---------------- */
const Bgm = (() => {
  let song = null, name = null, want = null;
  let step = 0, nextT = 0, timer = null;

  function intensity() {
    if (song && song.fixed != null) return song.fixed;
    if (state !== 'play') return 0;
    const p = percent();
    let i = 0;
    if (p >= 22 || sparxes.length >= 3) i = 1;
    if (p >= 45) i = 2;
    if (p >= 62 || lives <= 1) i = 3;
    return i;
  }
  function bpmNow(inten) { return song.bpm * (inten >= 3 ? 1.07 : 1); }

  function scheduleStep(st, t, inten, stepDur) {
    for (const tr of song.tracks) {
      if (tr.l > inten) continue;
      if (tr.t === 'n') {
        const nm = tr.s[st % tr.s.length];
        if (nm) Snd.note(hz(nm), t, Math.max(0.03, stepDur * tr.g), tr.w, tr.v);
      } else if (tr.t === 'kick')  { if (tr.set.has(st)) Snd.kick(t, tr.v); }
        else if (tr.t === 'hat')   { if (tr.set.has(st)) Snd.hat(t, tr.v); }
        else if (tr.t === 'snare') { if (tr.set.has(st)) Snd.snare(t, tr.v); }
    }
  }
  function tick() {
    if (!Snd.ac || !song) return;
    const ahead = Snd.ac.currentTime + 0.18;
    while (nextT < ahead) {
      const inten = intensity();
      const sd = 60 / bpmNow(inten) / 4; // 16分音符の長さ
      scheduleStep(step, nextT, inten, sd);
      nextT += sd;
      step = (step + 1) % song.len;
    }
  }
  function startTimer() {
    if (timer == null) timer = setInterval(tick, 30);
  }
  return {
    // 曲名を指定して再生開始(AudioContext未生成なら予約だけ)
    play(n) {
      want = n;
      if (!Snd.ac) return;
      if (!(n in BGMDATA)) return;
      song = BGMDATA[n]; name = n;
      for (const tr of song.tracks) if (tr.p && !tr.set) tr.set = new Set(tr.p);
      step = 0;
      nextT = Snd.ac.currentTime + 0.08;
      startTimer();
      tick();
    },
    pause() { if (timer != null) { clearInterval(timer); timer = null; } },
    resume() {
      if (!Snd.ac || !song) return;
      nextT = Snd.ac.currentTime + 0.06;
      startTimer();
    },
    stop() { this.pause(); song = null; name = null; want = null; },
    onAudioReady() { if (want && !song) this.play(want); },
    get playing() { return name; },
    get want() { return want; },
  };
})();

/* ---------------- 入力 ---------------- */
const held = { up:false, down:false, left:false, right:false, fast:false, slow:false };
const dirOrder = []; // 後から押した方向を優先
function pressDir(d)   { if (!held[d]) { held[d] = true; dirOrder.unshift(d); } }
function releaseDir(d) { held[d] = false; const i = dirOrder.indexOf(d); if (i >= 0) dirOrder.splice(i, 1); }
function currentDir()  { for (const d of dirOrder) if (held[d]) return d; return null; }

/* =====================================================================
   盤面(サーフェス)
   どの盤面も「セルのグラフ」として扱う。ゲームロジックはグラフだけを見る。
   ・nb[c*4+k]  … 4近傍(k=0..3 は一周する順。k と k+2 が向かい合う = 直進)
   ・nb8[c*8+m] … 斜めを含む近傍(境界判定用、-1=なし)
   ・pos[c*3..] … セル中心の座標(平面は x,y / 立体はワールド座標)
   QIXの位置表現だけは盤面ごとに違う(平面: x,y / 立体: 単位ベクトル p と進行方向 h)
===================================================================== */
// 斜め近傍 = 自分の4近傍のうち2つ以上と隣り合うセル
function buildNb8(N, nb) {
  const nb8 = new Int32Array(N * 8).fill(-1);
  const cnt = new Map(), own = [];
  for (let c = 0; c < N; c++) {
    let m = 0;
    own.length = 0;
    for (let k = 0; k < 4; k++) { const a = nb[c * 4 + k]; if (a >= 0) { own.push(a); nb8[c * 8 + m++] = a; } }
    cnt.clear();
    for (const a of own) for (let k = 0; k < 4; k++) {
      const b = nb[a * 4 + k];
      if (b < 0 || b === c || own.includes(b)) continue;
      cnt.set(b, (cnt.get(b) || 0) + 1);
    }
    for (const [b, n] of cnt) if (n >= 2 && m < 8) nb8[c * 8 + m++] = b;
  }
  return nb8;
}

/* ---- 平面 ---- */
function blockedCell(fx, fy) {
  const cx = Math.floor(fx), cy = Math.floor(fy);
  if (cx < 0 || cy < 0 || cx >= GW || cy >= GH) return true;
  return grid[idx(cx, cy)] !== OPEN;
}

function makePlaneSurface() {
  const N = GW * GH;
  const nb = new Int32Array(N * 4).fill(-1);
  const pos = new Float32Array(N * 3);
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
    const c = idx(x, y);
    pos[c * 3] = x; pos[c * 3 + 1] = y;
    for (let k = 0; k < 4; k++) {
      const nx = x + DIRS4[k][0], ny = y + DIRS4[k][1];
      if (nx >= 0 && ny >= 0 && nx < GW && ny < GH) nb[c * 4 + k] = idx(nx, ny);
    }
  }
  return {
    key: 'PLANE', def: CONFIG.SURF.PLANE, is3D: false, N, nb, nb8: buildNb8(N, nb), pos,
    // 外周を壁にする。戻り値: 自機の出発セル / SPARXの出現セル
    setup() {
      for (let x = 0; x < GW; x++) { grid[idx(x, 0)] = WALL; grid[idx(x, GH - 1)] = WALL; }
      for (let y = 0; y < GH; y++) { grid[idx(0, y)] = WALL; grid[idx(GW - 1, y)] = WALL; }
      return { start: idx(GW >> 1, GH - 1), home: idx(GW >> 1, 0) };
    },
    screenOf(c) { return { x: (c % GW) * CS + CS / 2, y: FIELD_Y + ((c / GW) | 0) * CS + CS / 2 }; },
    qixSpawn(k, nq) {
      return { x: GW * (nq === 1 ? 0.5 : k ? 0.68 : 0.32), y: GH * 0.35, head: Math.random() * Math.PI * 2 };
    },
    qixCell(q) { return idx(clamp(Math.floor(q.x), 1, GW - 2), clamp(Math.floor(q.y), 1, GH - 2)); },
    qixTurn(q, a) { q.head += a; },
    qixMove(q, dist) {
      while (dist > 0) { // 高速時のすり抜け防止のためサブステップ
        const step = Math.min(0.4, dist);
        dist -= step;
        const nx = q.x + Math.cos(q.head) * step;
        const ny = q.y + Math.sin(q.head) * step;
        let bounced = false;
        if (blockedCell(nx, q.y)) { q.head = Math.PI - q.head; bounced = true; }
        if (blockedCell(q.x, ny)) { q.head = -q.head; bounced = true; }
        if (!bounced) {
          if (blockedCell(nx, ny)) { q.head += Math.PI; }
          else { q.x = nx; q.y = ny; }
        }
      }
    },
    qixArm(q, a, L) {
      return { x1: q.x + Math.cos(a) * L, y1: q.y + Math.sin(a) * L,
               x2: q.x - Math.cos(a) * L, y2: q.y - Math.sin(a) * L };
    },
    // 腕の上のセルを順に fn へ渡す(fn が true を返したら打ち切り)
    segEach(sg, fn) {
      for (let t = 0; t <= 1.0001; t += 0.1) {
        const cx = Math.floor(sg.x1 + (sg.x2 - sg.x1) * t);
        const cy = Math.floor(sg.y1 + (sg.y2 - sg.y1) * t);
        if (cx < 0 || cy < 0 || cx >= GW || cy >= GH) continue;
        if (fn(idx(cx, cy))) return true;
      }
      return false;
    },
    qixScreen(q) { return { x: q.x * CS, y: FIELD_Y + q.y * CS }; },
  };
}

/* ---- 立方体・球(キューブスフィア) ----
   立方体の6面をそれぞれ n×n に区切ったものがセル。球はそれを膨らませたもの。
   両者はつながり方(グラフ)が同じで、形と見た目だけが違う。
   各面は [法線N, 面内の軸U, 面内の軸V] (U×V=N)。 */
const CUBE_FACES = [
  [[0,0,1],  [1,0,0],  [0,1,0]],   // 0 手前(+Z)  ← 初期陣地はこの面の中央
  [[0,0,-1], [-1,0,0], [0,1,0]],   // 1 奥
  [[1,0,0],  [0,0,-1], [0,1,0]],   // 2 右
  [[-1,0,0], [0,0,1],  [0,1,0]],   // 3 左
  [[0,1,0],  [1,0,0],  [0,0,-1]],  // 4 上
  [[0,-1,0], [1,0,0],  [0,0,1]],   // 5 下
];
const CUBE_HALF = 0.62;           // 立方体の半辺(球の半径=1に対して)

// 方向ベクトル → [面, u, v](u,v は面上の -1..1)
function cubeFaceUV(x, y, z) {
  const ax = Math.abs(x), ay = Math.abs(y), az = Math.abs(z);
  if (az >= ax && az >= ay) return z > 0 ? [0, x / az, y / az] : [1, -x / az, y / az];
  if (ax >= ay)             return x > 0 ? [2, -z / ax, y / ax] : [3, z / ax, y / ax];
  return y > 0 ? [4, x / ay, -z / ay] : [5, x / ay, z / ay];
}

function makeCubeSurface(key) {
  const def = CONFIG.SURF[key];
  const sph = key === 'SPHERE';
  const n = def.n, nn = n * n, N = 6 * nn, VN = n + 1, nv = 6 * VN * VN;
  const QA = Math.PI / 4;
  // 球は「等角」割り付け(セルの大きさが揃う)、立方体は等間隔
  const warp   = t => sph ? Math.tan(t * QA) : t;
  const unwarp = u => sph ? Math.atan(u) / QA : u;
  const cellIJ = (f, a, b) => f * nn + clamp(Math.floor((b + 1) * 0.5 * n), 0, n - 1) * n
                                     + clamp(Math.floor((a + 1) * 0.5 * n), 0, n - 1);
  function cellAt(x, y, z) {
    const r = cubeFaceUV(x, y, z);
    return cellIJ(r[0], unwarp(r[1]), unwarp(r[2]));
  }
  // 面上の点(方向ベクトル d)を実際の形の表面へ
  function place(d) {
    if (sph) return vnorm(d);
    const m = Math.max(Math.abs(d[0]), Math.abs(d[1]), Math.abs(d[2]));
    return [d[0] / m * CUBE_HALF, d[1] / m * CUBE_HALF, d[2] / m * CUBE_HALF];
  }
  const facePt = (F, u, v) => [F[0][0] + F[1][0] * u + F[2][0] * v,
                               F[0][1] + F[1][1] * u + F[2][1] * v,
                               F[0][2] + F[1][2] * u + F[2][2] * v];

  const dir = new Float32Array(N * 3), pos = new Float32Array(N * 3), nor = new Float32Array(N * 3);
  const nc = new Float32Array(N), par = new Uint8Array(N);
  const nb = new Int32Array(N * 4), quad = new Int32Array(N * 4);
  const vpos = new Float32Array(nv * 3);
  const OFS = [[0,-1],[1,0],[0,1],[-1,0]];   // k=0..3: -v, +u, +v, -u
  for (let f = 0; f < 6; f++) {
    const F = CUBE_FACES[f];
    for (let b = 0; b <= n; b++) for (let a = 0; a <= n; a++) {
      const p = place(facePt(F, warp(a / n * 2 - 1), warp(b / n * 2 - 1)));
      const v = f * VN * VN + b * VN + a;
      vpos[v * 3] = p[0]; vpos[v * 3 + 1] = p[1]; vpos[v * 3 + 2] = p[2];
    }
    for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
      const c = f * nn + j * n + i;
      const ta = (i + 0.5) / n * 2 - 1, tb = (j + 0.5) / n * 2 - 1;
      const d = facePt(F, warp(ta), warp(tb));
      const dn = vnorm(d), p = place(d), no = sph ? dn : F[0];
      for (let e = 0; e < 3; e++) { dir[c * 3 + e] = dn[e]; pos[c * 3 + e] = p[e]; nor[c * 3 + e] = no[e]; }
      nc[c] = vdot(no, p);
      par[c] = (i + j) & 1;
      const v0 = f * VN * VN + j * VN + i;
      quad[c * 4] = v0; quad[c * 4 + 1] = v0 + 1; quad[c * 4 + 2] = v0 + VN + 1; quad[c * 4 + 3] = v0 + VN;
      // つながり: 等間隔座標で1セル先の点がどのセルか(面の外に出れば隣の面のセルになる)
      for (let k = 0; k < 4; k++) {
        const q = facePt(F, ta + OFS[k][0] * 2 / n, tb + OFS[k][1] * 2 / n);
        const r = cubeFaceUV(q[0], q[1], q[2]);
        nb[c * 4 + k] = cellIJ(r[0], r[1], r[2]);
      }
    }
  }
  const cellAng = (Math.PI / 2) / n;       // 1セルぶんの角度(ラジアン)
  const world = p => place(p);             // QIXの方向ベクトル → 表面上の点
  const S = {
    key, def, is3D: true, sph, n, N, nb, nb8: buildNb8(N, nb), pos, dir, nor, nc, par, quad, vpos, nv,
    cellAt, world,
    // 初期陣地(HOME): 手前の面の中央 (2h)×(2h) マス。縁だけ線の色にする
    setup() {
      const h = def.home, lo = (n >> 1) - h, hi = (n >> 1) + h - 1;
      for (let j = lo; j <= hi; j++) for (let i = lo; i <= hi; i++) {
        const c = j * n + i;
        grid[c] = WALL;
        colA[c] = (i === lo || i === hi || j === lo || j === hi) ? 0 : HOME_COL;
      }
      return { start: lo * n + (n >> 1), home: hi * n + (n >> 1) };
    },
    screenOf(c) { return projXYZ(pos[c * 3] * 1.01, pos[c * 3 + 1] * 1.01, pos[c * 3 + 2] * 1.01); },
    // QIXは陣地の反対側(奥の面)から出る
    qixSpawn(k, nq) {
      const a = nq === 1 ? 0 : (k ? 0.7 : -0.7);
      const p = vnorm([Math.sin(a), 0.15 * (k ? 1 : -1) * (nq - 1), -Math.cos(a)]);
      let h = vnorm(vcross(p, [0, 1, 0]));
      h = rotAround(h, p, rand(0, Math.PI * 2));
      return { p, h };
    },
    qixCell(q) { return cellAt(q.p[0], q.p[1], q.p[2]); },
    qixTurn(q, a) { q.h = rotAround(q.h, q.p, a); },
    qixMove(q, dist) {
      let rem = dist * cellAng;
      const smax = 0.4 * cellAng;
      while (rem > 0) {
        const a = Math.min(smax, rem);
        rem -= a;
        const np = vnorm(vadd(q.p, q.h, a));
        if (grid[cellAt(np[0], np[1], np[2])] !== OPEN) {
          q.h = rotAround(q.h, q.p, Math.PI + rand(-0.9, 0.9)); // 跳ね返り
          continue;
        }
        q.h = vnorm(vadd(q.h, np, -vdot(q.h, np)));            // 進行方向を新しい位置の接平面へ
        q.p = np;
      }
    },
    qixArm(q, a, L) {
      const d = vadd(vadd([0,0,0], q.h, Math.cos(a)), vcross(q.p, q.h), Math.sin(a));
      const pts = [];
      for (let m = 0; m <= 12; m++) pts.push(vnorm(vadd(q.p, d, (m / 6 - 1) * L * cellAng)));
      return { pts };
    },
    segEach(sg, fn) {
      for (const p of sg.pts) if (fn(cellAt(p[0], p[1], p[2]))) return true;
      return false;
    },
    qixScreen(q) { const w = world(q.p); return projXYZ(w[0], w[1], w[2]); },
  };
  return S;
}
// 接ベクトル h を軸 p(単位・h⊥p)まわりに角度 a 回す
function rotAround(h, p, a) {
  const c = Math.cos(a), s = Math.sin(a), x = vcross(p, h);
  return vnorm([h[0] * c + x[0] * s, h[1] * c + x[1] * s, h[2] * c + x[2] * s]);
}

const SURF_CACHE = {};
function getSurface(key) {
  if (!SURF_CACHE[key]) SURF_CACHE[key] = key === 'PLANE' ? makePlaneSurface() : makeCubeSurface(key);
  return SURF_CACHE[key];
}
function surfaceFor(lv) {
  if (settings.mode !== 'TOUR') return settings.mode;
  return CONFIG.TOUR[(lv - 1) % CONFIG.TOUR.length];
}

/* ---------------- カメラ(立体面用) ----------------
   R は回転行列(行優先)。ビュー座標は x=右, y=上, z=手前。
   プレイ中は自機のいる方向が画面の正面に来るよう、最小回転でなめらかに追う */
const cam = { R: [1,0,0, 0,1,0, 0,0,1], D: 3.4, F: 0, cx: W / 2, cy: FIELD_Y + (H - FIELD_Y) / 2 };
cam.F = 285 * Math.sqrt(cam.D * cam.D - 1);  // 半径1の球が画面上で半径285pxになる
const LIGHT_V = vnorm([-0.35, 0.55, 0.85]);  // 光源(ビュー座標)

function projXYZ(x, y, z) {
  const R = cam.R;
  const Z = R[6] * x + R[7] * y + R[8] * z, s = cam.F / (cam.D - Z);
  return { x: cam.cx + (R[0] * x + R[1] * y + R[2] * z) * s, y: cam.cy - (R[3] * x + R[4] * y + R[5] * z) * s, z: Z };
}
function camSnap(f) {
  f = vnorm(f);
  let up = Math.abs(f[1]) > 0.95 ? [0, 0, -1] : [0, 1, 0];
  up = vnorm(vadd(up, f, -vdot(up, f)));
  const r = vcross(up, f);
  cam.R = [r[0], r[1], r[2], up[0], up[1], up[2], f[0], f[1], f[2]];
}
// ビュー座標の軸 axis まわりに ang 回したものを R に左から掛ける
function camRotate(axis, ang) {
  const [x, y, z] = vnorm(axis), c = Math.cos(ang), s = Math.sin(ang), t = 1 - c;
  const M = [t*x*x + c,   t*x*y - s*z, t*x*z + s*y,
             t*x*y + s*z, t*y*y + c,   t*y*z - s*x,
             t*x*z - s*y, t*y*z + s*x, t*z*z + c];
  const R = cam.R, o = new Array(9);
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++)
    o[i * 3 + j] = M[i * 3] * R[j] + M[i * 3 + 1] * R[3 + j] + M[i * 3 + 2] * R[6 + j];
  // 誤差がたまらないよう正規直交化
  const r0 = vnorm([o[0], o[1], o[2]]);
  let r1 = [o[3], o[4], o[5]];
  r1 = vnorm(vadd(r1, r0, -vdot(r1, r0)));
  const r2 = vcross(r0, r1);
  cam.R = [r0[0], r0[1], r0[2], r1[0], r1[1], r1[2], r2[0], r2[1], r2[2]];
}
function camFollow(c, dt) {
  const d = [surf.dir[c * 3], surf.dir[c * 3 + 1], surf.dir[c * 3 + 2]], R = cam.R;
  const v = [R[0] * d[0] + R[1] * d[1] + R[2] * d[2], R[3] * d[0] + R[4] * d[1] + R[5] * d[2],
             R[6] * d[0] + R[7] * d[1] + R[8] * d[2]];
  const ang = Math.atan2(Math.hypot(v[0], v[1]), v[2]);
  if (ang > 1e-4) camRotate([v[1], -v[0], 0], ang * (1 - Math.exp(-dt * 6)));
  // 傾き補正: 自機のいるマスの格子が画面の縦横にそろうよう、画面の奥行き軸まわりに回す
  // (90°単位で一番近い向きへ。これで方向キーと格子の向きが一致する)
  const nb = surf.nb, P = surf.pos, a = nb[c * 4 + 1] * 3, b = nb[c * 4 + 3] * 3, Rn = cam.R;
  const gx = P[a] - P[b], gy = P[a + 1] - P[b + 1], gz = P[a + 2] - P[b + 2];
  const sx = Rn[0] * gx + Rn[1] * gy + Rn[2] * gz, sy = Rn[3] * gx + Rn[4] * gy + Rn[5] * gz;
  const phi = Math.atan2(sy, sx), Q = Math.PI / 2;
  const roll = Math.round(phi / Q) * Q - phi;
  if (Math.abs(roll) > 1e-4) camRotate([0, 0, 1], roll * (1 - Math.exp(-dt * 3)));
}
function updateCamera(dt) {
  if (!surf.is3D) return;
  if (state === 'play' || state === 'ready') camFollow(player.c, dt);
  else if (state !== 'pause') camRotate([0.25, 1, 0], dt * 0.35); // タイトル等ではゆっくり回る
}

/* ---------------- ゲーム状態 ---------------- */
let surf = getSurface('PLANE');
let grid, colA;                 // セル状態 / 占領色(0=線, 1..8=占領色, 9=HOME)
let claimed = 0, initOpen = 1;  // 占領セル数 / 初期空きセル数
let level = 1, score = 0, hiScore = hiOf(settings.mode);
let lives = settings.lives;
let nextExtend = CONFIG.EXTEND_FIRST;
let state = 'title', stTimer = 0, blinkT = 0;
let deathTimer = 0, lastBonus = 0, wasSplit = false;
let shakeT = 0;                 // 画面揺れの残り時間
let pausedFrom = 'play';        // ポーズ前の状態(ready/play)
let optSel = 0;                 // OPTIONS選択行
let homeCell = -1;              // SPARXの出現セル
let hintT = 0;                  // 「Zを押しながら」ヒントの再表示までの時間

// c=今いるセル / prev=直前のセル / lastDir=直前に進んだキー方向(直進判定用)
const player = { c:0, prev:-1, lastDir:null, acc:0, drawing:false, usedFast:false, invuln:0 };
let trail = [], trailStart = -1;  // 軌跡(セル番号の列) / 描画を始めたセル
const fuse = { wait:0, pos:0, lit:false, sndT:0 };
let qixes = [];
let sparxes = [], sparxTimer = 0;
let particles = [], floats = [];

// テーマ由来の実行時パレット(applyThemeで再計算)
let themePal = [], themePalD = [], col3D = [];

function setState(s) { state = s; stTimer = 0; }
function percent()   { return claimed / initOpen * 100; }
function target()    { return surf.def.target; }

/* ---------------- テーマ適用 ---------------- */
const LV = 6;       // 立体面の陰影段階数
const NCOL = 23;    // 立体面の色の種類(下の bases の数)
function applyTheme() {
  const t = theme();
  themePal = t.fast.concat(t.slow);
  themePalD = themePal.map(c => shade(c, 0.80)); // ディザ用の暗色
  // 立体面用: [色の種類 × 陰影段階] の色文字列表
  const fld = rgbOf(t.field), acc = rgbOf(t.accent);
  const bases = [
    mixRgb(fld, acc, 0.24), mixRgb(fld, acc, 0.18),   // 0,1 空き地(市松)
    mixRgb([0,0,0], acc, 0.30),                       // 2 クリア時の封鎖色
    rgbOf(t.line), rgbOf(t.trailF), rgbOf(t.trailS),  // 3 線 / 4,5 軌跡
    mixRgb([0,0,0], acc, 0.42),                       // 6 HOME
  ].concat(themePal.map(rgbOf), themePal.map(c => mixRgb([0,0,0], rgbOf(c), 0.8)));
  col3D = [];
  bases.forEach((b, ci) => {
    const bright = ci >= 3 && ci <= 5;
    for (let l = 0; l < LV; l++)
      col3D.push(rgbStr(b, bright ? 0.62 + 0.38 * l / (LV - 1) : 0.36 + 0.78 * l / (LV - 1)));
  });
  try {
    document.body.style.background =
      `radial-gradient(ellipse at 50% 30%, ${t.bgOuter} 0%, ${t.bg} 70%)`;
  } catch (e) {}
  if (grid) redrawField();
}
function applyCrt() {
  try { document.body.classList.toggle('crt', !!settings.crt); } catch (e) {}
}

/* ---------------- フィールド ---------------- */
function isBoundary(c) {
  if (c < 0 || grid[c] !== WALL) return false;
  const nb8 = surf.nb8;
  for (let m = c * 8, e = m + 8; m < e; m++) {
    const b = nb8[m];
    if (b >= 0 && grid[b] === OPEN) return true;
  }
  return false;
}
function nbIndex(c, n) {
  for (let k = 0; k < 4; k++) if (surf.nb[c * 4 + k] === n) return k;
  return -1;
}

function makeQix(k, nq, spd) {
  return Object.assign(surf.qixSpawn(k, nq), { arm: rand(0, 6), hue: rand(0, 360), segs: [], segT: 0, spd });
}

function initLevel(lv) {
  surf = getSurface(surfaceFor(lv));
  grid = new Uint8Array(surf.N);
  colA = new Uint8Array(surf.N);
  const s = surf.setup();
  homeCell = s.home;
  initOpen = 0;
  for (let i = 0; i < surf.N; i++) if (grid[i] === OPEN) initOpen++;
  claimed = 0;

  player.c = s.start; player.prev = -1; player.lastDir = null;
  player.acc = 0; player.drawing = false; player.usedFast = false; player.invuln = 0;
  trail = []; trailStart = -1;
  fuseReset();
  if (surf.is3D) camSnap([surf.dir[player.c * 3], surf.dir[player.c * 3 + 1], surf.dir[player.c * 3 + 2]]);

  const spd = CONFIG.QIX_SPEED * diff().qix * Math.pow(CONFIG.QIX_ACCEL, lv - 1) * surf.def.qixSpeed;
  qixes = [];
  const nq = lv >= CONFIG.TWO_QIX_FROM ? 2 : 1;
  for (let k = 0; k < nq; k++) qixes.push(makeQix(k, nq, spd));

  sparxes = [];
  const ns = Math.min(4, surf.def.sparxStart + ((lv - 1) >> 1));
  for (let i = 0; i < ns; i++) spawnSparx(i % 2 ? 1 : -1, surf.def.sparxWait + i * 1.5 * (surf.def.sparxWait > 0));
  sparxTimer = CONFIG.SPARX_INTERVAL * diff().interval;

  particles = []; floats = [];
  deathTimer = 0; wasSplit = false; shakeT = 0;
  redrawField();
}

// 平面: 占領済みレイヤーをオフスクリーンへ焼き込む(市松ディザで質感を出す)
function redrawField() {
  if (surf.is3D) return; // 立体面は毎フレーム描く
  const t = theme();
  fctx.fillStyle = t.field;
  fctx.fillRect(0, 0, fieldC.width, fieldC.height);
  for (let y = 0; y < GH; y++) {
    for (let x = 0; x < GW; x++) {
      const i = idx(x, y);
      if (grid[i] === WALL) {
        const c = colA[i];
        fctx.fillStyle = c ? ((x + y) & 1 ? themePalD[c - 1] : themePal[c - 1]) : t.line;
        fctx.fillRect(x * CS, y * CS, CS, CS);
      }
    }
  }
}

// クリア時: 残った空き地を薄く塗って「封鎖」感を出す(判定には影響しない。立体面は描画側で処理)
function sealRemaining() {
  if (surf.is3D) return;
  const c = shade(theme().accent, 0.28);
  fctx.fillStyle = c;
  for (let y = 0; y < GH; y++)
    for (let x = 0; x < GW; x++)
      if (grid[idx(x, y)] === OPEN) fctx.fillRect(x * CS, y * CS, CS, CS);
}

// startIdx を含む連結空き地を訪問済みにして返す
function visitedFrom(startIdx) {
  const N = surf.N, nb = surf.nb;
  const visited = new Uint8Array(N);
  if (startIdx < 0 || grid[startIdx] !== OPEN) return visited;
  const q = new Int32Array(N);
  let h = 0, t = 0;
  q[t++] = startIdx; visited[startIdx] = 1;
  while (h < t) {
    const i = q[h++];
    for (let k = 0; k < 4; k++) {
      const j = nb[i * 4 + k];
      if (j >= 0 && !visited[j] && grid[j] === OPEN) { visited[j] = 1; q[t++] = j; }
    }
  }
  return visited;
}

// c が空き地ならそのまま、違えば近くの空き地セルを探す(QIXが線の上に乗った場合の安全策)
function openNear(c) {
  if (grid[c] === OPEN) return c;
  const N = surf.N, nb = surf.nb, seen = new Uint8Array(N);
  let cur = [c]; seen[c] = 1;
  for (let r = 0; r < 12 && cur.length; r++) {
    const nx = [];
    for (const a of cur) for (let k = 0; k < 4; k++) {
      const b = nb[a * 4 + k];
      if (b < 0 || seen[b]) continue;
      if (grid[b] === OPEN) return b;
      seen[b] = 1; nx.push(b);
    }
    cur = nx;
  }
  for (let i = 0; i < N; i++) if (grid[i] === OPEN) return i; // 最終安全策(全部塗り事故の防止)
  return -1;
}

// QIX(先頭)のいる連結領域を残し、それ以外の空き地を占領する
function claimFill(palNo) {
  const visited = visitedFrom(openNear(surf.qixCell(qixes[0])));
  let gained = 0;
  for (let i = 0; i < surf.N; i++) {
    if (grid[i] === OPEN && !visited[i]) { grid[i] = WALL; colA[i] = palNo; gained++; }
  }
  return gained;
}

// 占領後などに、プレイヤーが線上(境界)から外れていたら最寄りの境界へ寄せる
function snapPlayerToBoundary() {
  if (isBoundary(player.c)) return;
  const nb = surf.nb, visited = new Uint8Array(surf.N);
  const q = [player.c];
  visited[player.c] = 1;
  for (let h = 0; h < q.length; h++) {
    const c = q[h];
    if (isBoundary(c)) { player.c = c; player.prev = -1; return; }
    for (let k = 0; k < 4; k++) {
      const j = nb[c * 4 + k];
      if (j >= 0 && !visited[j] && grid[j] === WALL) { visited[j] = 1; q.push(j); }
    }
  }
}

/* ---------------- プレイヤー ---------------- */
function canEnter(n) {
  if (n < 0) return false;
  const v = grid[n];
  if (player.drawing) return v !== TRAIL;
  return (v === WALL && isBoundary(n)) || (v === OPEN && (held.fast || held.slow));
}

// 押された方向 d(画面上の上下左右)に進む先のセルを選ぶ。なければ -1
function chooseMove(d) {
  const c = player.c, nb = surf.nb;
  if (!surf.is3D) return nb[c * 4 + DIRK[d]];
  // 立体面: 隣の4セルを画面に投影して、押した向きに一番近いものを選ぶ
  const [wx, wy] = DIRV[d], p0 = surf.screenOf(c), dots = [-2, -2, -2, -2];
  for (let k = 0; k < 4; k++) {
    const n = nb[c * 4 + k];
    if (n < 0) continue;
    const p = surf.screenOf(n), dx = p.x - p0.x, dy = p.y - p0.y;
    dots[k] = (dx * wx + dy * wy) / (Math.hypot(dx, dy) || 1);
  }
  // 同じキーを押し続けているなら、面の継ぎ目で画面上の向きがずれても直進を続ける
  if (player.lastDir === d && player.prev >= 0) {
    const kp = nbIndex(c, player.prev);
    if (kp >= 0) {
      const ks = (kp + 2) & 3, n = nb[c * 4 + ks];
      if (dots[ks] > 0.2 && canEnter(n)) return n;
    }
  }
  let best = -1, bd = 0.4;
  for (let k = 0; k < 4; k++) if (dots[k] > bd && canEnter(nb[c * 4 + k])) { bd = dots[k]; best = nb[c * 4 + k]; }
  if (best >= 0 || player.drawing) return best;
  // 線の上: 曲がった境界でもキーを押しっぱなしで線沿いに進めるようにする
  bd = 0.15;
  for (let k = 0; k < 4; k++) {
    const n = nb[c * 4 + k];
    if (n !== player.prev && dots[k] > bd && canEnter(n)) { bd = dots[k]; best = n; }
  }
  return best;
}

function playerMove(d) {
  if (!playerStep(chooseMove(d))) return false;
  player.lastDir = d;
  return true;
}

function playerStep(n) {
  if (n < 0) return false;
  const v = grid[n];

  if (!player.drawing) {
    if (v === WALL && isBoundary(n)) { player.prev = player.c; player.c = n; return true; }
    if (v === OPEN && (held.fast || held.slow)) {
      // 描画開始
      player.drawing = true;
      player.usedFast = false;
      trailStart = player.c;
      trail = [];
      fuseReset();
      Snd.startDraw(!held.fast && held.slow);
      enterTrail(n);
      return true;
    }
    return false;
  } else {
    if (v === OPEN)  { enterTrail(n); return true; }
    if (v === WALL)  { player.prev = player.c; player.c = n; closeTrail(); return true; }
    return false; // 自分の軌跡には入れない
  }
}

function enterTrail(n) {
  grid[n] = TRAIL;
  trail.push(n);
  player.prev = player.c; player.c = n;
  if (held.fast) player.usedFast = true;
  Snd.updateDraw(trail.length, !held.fast && held.slow);
}

function closeTrail() {
  Snd.stopDraw();
  const slow = !player.usedFast;
  const mul = (slow ? 2 : 1) * surf.def.pts;
  const palNo = (slow ? 4 : 0) + 1 + ((Math.random() * 4) | 0); // 1..4=FAST色, 5..8=SLOW色

  // 軌跡を壁化(線のセルも空き地から奪った領域として計上する)
  for (const c of trail) { grid[c] = WALL; colA[c] = 0; }

  // ---- QIX分断チェック(2体時): 別領域に分かれたら即クリア ----
  if (qixes.length > 1) {
    const seen = visitedFrom(openNear(surf.qixCell(qixes[0])));
    const crushed = qixes.filter((q, i) => i > 0 && !seen[openNear(surf.qixCell(q))]);
    if (crushed.length) {
      let gained = trail.length;
      for (let i = 0; i < surf.N; i++) {
        if (grid[i] === OPEN && !seen[i]) { grid[i] = WALL; colA[i] = palNo; gained++; }
      }
      claimed += gained;
      score += gained * mul;
      for (const q of crushed) {
        const sp = surf.qixScreen(q);
        spawnParticles(sp.x, sp.y, 42, theme().accent);
        qixes.splice(qixes.indexOf(q), 1);
      }
      floats.push({ x: W / 2, y: H * 0.4, txt: 'QIX SPLIT!!', t: 2.0, col: theme().accent, big: true });
      trail = [];
      player.drawing = false;
      fuseReset();
      redrawField();
      snapPlayerToBoundary();
      shakeT = 0.4;
      Snd.split();
      startClear(true);
      return;
    }
  }

  const gained = claimFill(palNo) + trail.length;
  claimed += gained;

  if (gained > 0) {
    let pts = gained * mul;
    // 一度に大きく囲んだらボーナス
    const gp = gained / initOpen * 100;
    if (gp >= CONFIG.BIG_CLAIM) {
      const bonus = Math.round(gp * CONFIG.BIG_CLAIM_PTS);
      pts += bonus;
      floats.push({ x: W / 2, y: H * 0.45, txt: 'BIG CLAIM +' + bonus, t: 1.6, col: '#8dff9e', big: true });
      Snd.big();
    }
    score += pts;
    checkExtend();
    const sp = surf.screenOf(player.c);
    floats.push({
      x: sp.x, y: sp.y,
      txt: '+' + gained * mul + (slow ? ' x2' : ''), t: 1.2,
      col: slow ? theme().trailS : theme().trailF,
    });
    for (let i = 0; i < trail.length; i += surf.is3D ? 3 : 6) {
      const p = surf.screenOf(trail[i]);
      spawnParticles(p.x, p.y, 2, slow ? theme().trailS : theme().trailF);
    }
    Snd.claim(gained * (surf.is3D ? 4 : 1), slow);
  }

  trail = [];
  player.drawing = false;
  fuseReset();
  redrawField();
  snapPlayerToBoundary();

  if (percent() >= target()) startClear(false);
}

function checkExtend() {
  while (score >= nextExtend) {
    lives++;
    nextExtend += CONFIG.EXTEND_EVERY;
    floats.push({ x: W / 2, y: H / 2, txt: 'EXTEND!', t: 1.6, col: '#8dff9e', big: true });
    Snd.extend();
  }
}

// 線の上で空き地へ進もうとして止まったら、線の引き方をそっと教える
function drawHint() {
  if (player.drawing || held.fast || held.slow || hintT > 0) return;
  const nb = surf.nb, c = player.c;
  let open = false;
  for (let k = 0; k < 4; k++) if (nb[c * 4 + k] >= 0 && grid[nb[c * 4 + k]] === OPEN) open = true;
  if (!open) return;
  hintT = 3;
  const p = surf.screenOf(c);
  floats.push({ x: p.x, y: p.y - 18, txt: 'Z / X を押しながらで線を引く', t: 1.8, col: '#ffd76b' });
}

/* ---------------- 導火線 ---------------- */
function fuseReset() { fuse.wait = 0; fuse.pos = 0; fuse.lit = false; fuse.sndT = 0; }
function effFuseDelay() { return CONFIG.FUSE_DELAY * diff().fuse; }

function updateFuse(dt, stepped) {
  if (!player.drawing || trail.length === 0) return;
  if (stepped) { fuse.wait = 0; return; } // 動いている間は進まない(点火状態は維持)
  fuse.wait += dt;
  if (fuse.wait >= effFuseDelay()) {
    fuse.lit = true;
    fuse.pos += CONFIG.FUSE_SPEED * surf.def.speed * dt;
    fuse.sndT -= dt;
    if (fuse.sndT <= 0) { Snd.fuseCr(); fuse.sndT = 0.07; }
    if (fuse.pos >= trail.length) death();
  }
}

/* ---------------- QIX ---------------- */
function updateQix(q, dt) {
  surf.qixTurn(q, (Math.random() - 0.5) * 4 * dt);
  surf.qixMove(q, q.spd * dt);
  q.arm += 3.4 * dt;
  q.hue = (q.hue + 140 * dt) % 360;
  q.segT -= dt;
  if (q.segT <= 0) {
    q.segT = 0.033;
    const sg = surf.qixArm(q, q.arm, surf.def.arm * (0.65 + 0.35 * Math.sin(q.arm * 1.618)));
    sg.h = q.hue;
    q.segs.push(sg);
    if (q.segs.length > 15) q.segs.shift();
  }
  // 当たり判定: 最新セグメント上をサンプリング
  if (!q.segs.length || state !== 'play') return;
  surf.segEach(q.segs[q.segs.length - 1], c => {
    if (grid[c] === TRAIL || (player.drawing && c === player.c)) { death(); return true; }
    return false;
  });
}
function updateQixes(dt) {
  for (const q of qixes) {
    updateQix(q, dt);
    if (deathTimer > 0) return;
  }
}

/* ---------------- SPARX ---------------- */
// 出現セル: 決まった場所(homeCell)が線の上ならそこ、だめなら自機から一番遠い線の上
function sparxSpawnCell() {
  if (isBoundary(homeCell)) return homeCell;
  const P = surf.pos, pc = player.c * 3;
  let best = player.c, bd = -1;
  for (let c = 0; c < surf.N; c++) {
    if (!isBoundary(c)) continue;
    const dx = P[c * 3] - P[pc], dy = P[c * 3 + 1] - P[pc + 1], dz = P[c * 3 + 2] - P[pc + 2];
    const d = dx * dx + dy * dy + dz * dz;
    if (d > bd) { bd = d; best = c; }
  }
  return best;
}
// wait: 動き出すまでの秒数(その間は点滅するだけで当たらない)
function spawnSparx(dir, wait) {
  sparxes.push({ c: sparxSpawnCell(), prev: -1, dir, acc: rand(0, 0.8), wait: wait || 0 });
}

function stepSparx(s) {
  const nb = surf.nb, c = s.c, cands = [];
  for (let k = 0; k < 4; k++) {
    const n = nb[c * 4 + k];
    if (n >= 0 && isBoundary(n)) cands.push(n);
  }
  if (!cands.length) { // 占領で孤立 → 出現セルから再出現
    s.c = sparxSpawnCell(); s.prev = -1;
    return;
  }
  let opts = cands.filter(n => n !== s.prev);
  if (!opts.length) opts = cands;
  let next;
  if (s.prev < 0) next = s.dir > 0 ? opts[0] : opts[opts.length - 1];
  else {
    const kp = nbIndex(c, s.prev), straight = kp >= 0 ? nb[c * 4 + ((kp + 2) & 3)] : -1;
    next = opts.includes(straight) ? straight : pick(opts); // 直進優先、曲がり角はランダム
  }
  s.prev = c; s.c = next;
}

function updateSparxes(dt) {
  sparxTimer -= dt;
  if (sparxTimer <= 0 && sparxes.length < CONFIG.SPARX_MAX) {
    spawnSparx(Math.random() < 0.5 ? 1 : -1);
    Snd.sparx();
    floats.push({ x: W / 2, y: FIELD_Y + 20, txt: 'SPARX!', t: 1.0, col: '#ffe25c' });
    sparxTimer = CONFIG.SPARX_INTERVAL * diff().interval;
  }
  const spd = CONFIG.SPARX_SPEED * diff().sparx * surf.def.sparx;
  for (const s of sparxes) {
    if (s.wait > 0) { s.wait -= dt; continue; }
    s.acc += dt * spd;
    while (s.acc >= 1) {
      s.acc -= 1;
      stepSparx(s);
      if (s.c === player.c && player.invuln <= 0) { death(); return; }
    }
    if (s.c === player.c && player.invuln <= 0) { death(); return; }
  }
}

/* ---------------- ミス処理 ---------------- */
function death() {
  if (player.invuln > 0 || deathTimer > 0) return;
  deathTimer = 1.2;
  shakeT = 0.35;
  Snd.stopDraw();
  Snd.death();
  const p = surf.screenOf(player.c);
  spawnParticles(p.x, p.y, 30, '#ff5c8a');
}

function applyDeath() {
  lives--;
  for (const c of trail) grid[c] = OPEN; // 軌跡は消える
  trail = [];
  player.drawing = false;
  fuseReset();
  if (trailStart >= 0) { player.c = trailStart; player.prev = -1; }
  snapPlayerToBoundary();
  if (lives < 0) {
    saveHi();
    setState('over');
    Bgm.stop();
    Snd.over();
  } else {
    player.invuln = CONFIG.INVULN;
  }
}

/* ---------------- 進行 ---------------- */
function bgmName() { return surf.is3D ? 'orbit' : 'play'; }

function startGame() {
  score = 0;
  lives = settings.lives;
  level = 1;
  nextExtend = CONFIG.EXTEND_FIRST;
  initLevel(1);
  setState('ready');
  Bgm.play(bgmName());
  Snd.ready();
}

function startClear(split) {
  wasSplit = !!split;
  lastBonus = Math.max(0, Math.round((percent() - target()) * 150))
            + level * 500
            + (split ? CONFIG.SPLIT_BONUS + (level - 1) * CONFIG.SPLIT_BONUS_LV : 0);
  score += lastBonus;
  checkExtend();
  saveHi();
  Snd.stopDraw();
  Bgm.stop();
  if (!split) Snd.clear_();
  sealRemaining();
  setState('clear');
}

function nextLevel() {
  level++;
  initLevel(level);
  setState('ready');
  Bgm.play(bgmName());
  Snd.ready();
}

function backToTitle() {
  initLevel(1);
  setState('title');
  Bgm.play('title');
}

// タイトル画面で盤面モードを切り替える(背景のデモ盤面も差し替わる)
function cycleMode(dir) {
  const i = MODES.indexOf(settings.mode);
  settings.mode = MODES[(i + dir + MODES.length) % MODES.length];
  hiScore = hiOf(settings.mode);
  saveSettings();
  initLevel(1);
  Snd.blip();
}

function openOptions() { optSel = 0; setState('options'); Snd.select(); }
function closeOptions() { saveSettings(); setState('title'); Snd.select(); }

function onAction() {
  if (state === 'title') startGame();
  else if (state === 'clear' && stTimer > 0.8) nextLevel();
  else if (state === 'over'  && stTimer > 0.8) backToTitle();
}

function doPause() {
  if (state !== 'play' && state !== 'ready') return;
  pausedFrom = state;
  Snd.stopDraw();
  Bgm.pause();
  setState('pause');
}
function doResume() {
  setState(pausedFrom || 'play');
  Bgm.resume();
  if (player.drawing) Snd.startDraw(!player.usedFast);
}
function togglePause() {
  if (state === 'pause') doResume();
  else doPause();
}

/* ---------------- OPTIONS ---------------- */
const OPT_ITEMS = [
  { k:'bgm',   label:'BGM音量',  min:0, max:10 },
  { k:'sfx',   label:'効果音量', min:0, max:10 },
  { k:'diff',  label:'難易度',   vals:DIFF_KEYS },
  { k:'lives', label:'残機',     min:1, max:5 },
  { k:'theme', label:'テーマ',   vals:THEMES.map(t => t.name) },
  { k:'crt',   label:'CRT効果',  vals:['OFF','ON'], bool:true },
  { k:'_back', label:'もどる' },
];

function adjustOpt(dir) {
  const it = OPT_ITEMS[optSel];
  if (!it || it.k === '_back') return;
  if (it.bool) {
    settings[it.k] = !settings[it.k];
    if (it.k === 'crt') applyCrt();
  } else if (it.vals) {
    let i = it.k === 'diff' ? it.vals.indexOf(settings.diff) : settings[it.k] | 0;
    i = (i + dir + it.vals.length) % it.vals.length;
    if (it.k === 'diff') settings.diff = it.vals[i];
    else settings[it.k] = i;
    if (it.k === 'theme') applyTheme();
  } else {
    settings[it.k] = clamp((settings[it.k] | 0) + dir, it.min, it.max);
  }
  Snd.applyVols();
  Snd.blip();
  saveSettings();
}

/* ---------------- パーティクル・フロート文字 ---------------- */
function spawnParticles(px, py, n, col) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), sp = rand(25, 120);
    particles.push({ x: px, y: py, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, t: rand(0.3, 0.9), col });
  }
}
function updateParticles(dt) {
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 50 * dt; p.t -= dt; }
  particles = particles.filter(p => p.t > 0);
}
function updateFloats(dt) {
  for (const f of floats) { f.y -= 20 * dt; f.t -= dt; }
  floats = floats.filter(f => f.t > 0);
}

/* ---------------- 更新 ---------------- */
function update(dt) {
  if (deathTimer > 0) {
    deathTimer -= dt;
    updateParticles(dt); updateFloats(dt);
    if (deathTimer <= 0) applyDeath();
    return;
  }
  if (player.invuln > 0) player.invuln -= dt;
  if (hintT > 0) hintT -= dt;

  // プレイヤー移動(描画中は描画ボタンを押している間だけ進める)
  const d = currentDir();
  const spd = (player.drawing
    ? (held.fast ? CONFIG.DRAW_FAST : held.slow ? CONFIG.DRAW_SLOW : 0)
    : CONFIG.PLAYER_SPEED) * surf.def.speed;
  let stepped = false;
  if (d && spd > 0) {
    player.acc += dt * spd;
    while (player.acc >= 1) {
      player.acc -= 1;
      if (playerMove(d)) stepped = true;
      else { player.acc = 0; drawHint(); break; }
      if (state !== 'play' || deathTimer > 0) break; // クリア/ミス発生時は中断
    }
  } else {
    player.acc = 0;
  }
  if (state !== 'play') return;

  updateFuse(dt, stepped);
  if (deathTimer > 0) { updateParticles(dt); updateFloats(dt); return; }

  updateQixes(dt);
  if (deathTimer > 0) { updateParticles(dt); updateFloats(dt); return; }

  updateSparxes(dt);
  updateParticles(dt);
  updateFloats(dt);
}

// 状態遷移などフレーム毎の付随処理(ヘッドレステスト可能なよう分離)
function tickMeta(dt) {
  if (shakeT > 0) shakeT -= dt;
  if (state === 'ready' && stTimer >= CONFIG.READY_TIME) setState('play');
  updateCamera(dt);
}

/* ---------------- 描画 ---------------- */
// テーマに応じたQIXの線色(hueは0..360で回転している)
function qixStroke(h, light, alpha) {
  const t = theme();
  if (t.qixSat0) return `hsla(0, 0%, ${light + 15}%, ${alpha})`;
  if (t.qixHue) h = t.qixHue[0] + (h / 360) * (t.qixHue[1] - t.qixHue[0]);
  return `hsla(${h}, 95%, ${light}%, ${alpha})`;
}

// ポインタ用ヒット領域(描画時に更新)
let optRects = [], titleOptRect = null, titleModeRect = null, pauseRect = { x: W - 42, y: 6, w: 36, h: 36 };

function drawDiamond(px, py, r) {
  ctx.beginPath();
  ctx.moveTo(px, py - r); ctx.lineTo(px + r, py); ctx.lineTo(px, py + r); ctx.lineTo(px - r, py);
  ctx.closePath(); ctx.fill();
}
function drawSparx(px, py, s) {
  if (s.wait > 0 && Math.floor(blinkT * 6) % 2) return; // 出現待ち: 点滅
  const flick = (Math.sin(blinkT * 30 + s.c) > 0);
  ctx.strokeStyle = flick ? '#ffe25c' : '#ffffff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(px - 5, py); ctx.lineTo(px + 5, py);
  ctx.moveTo(px, py - 5); ctx.lineTo(px, py + 5);
  if (flick) { ctx.moveTo(px - 4, py - 4); ctx.lineTo(px + 4, py + 4); ctx.moveTo(px + 4, py - 4); ctx.lineTo(px - 4, py + 4); }
  ctx.stroke();
  ctx.fillStyle = '#fff7c0';
  ctx.fillRect(px - 2, py - 2, 4, 4);
}
function drawFuse(p) {
  ctx.fillStyle = pick(['#ffdd55', '#ff7733', '#ff3311']);
  const r = rand(3, 5);
  ctx.fillRect(p.x - r / 2, p.y - r / 2, r, r);
  ctx.fillStyle = '#ffdd55';
  ctx.fillRect(p.x + rand(-5, 5), p.y + rand(-5, 5), 2, 2);
}
function drawPlayer(t) {
  const blinkOff = player.invuln > 0 && (Math.floor(blinkT * 10) % 2 === 0);
  if (deathTimer > 0 || blinkOff) return;
  const p = surf.screenOf(player.c), sz = surf.is3D ? 7 : 6;
  ctx.shadowColor = player.drawing ? (player.usedFast ? t.trailF : t.trailS) : t.accent;
  ctx.shadowBlur = 10;
  ctx.fillStyle = '#ffffff';
  drawDiamond(p.x, p.y, sz);
  ctx.shadowBlur = 0;
  ctx.fillStyle = player.drawing ? (player.usedFast ? t.trailF : t.trailS) : '#ff3b6b';
  drawDiamond(p.x, p.y, sz / 2);
}

function render() {
  const t = theme();
  ctx.save();
  if (shakeT > 0) {
    const a = shakeT * 9;
    ctx.translate(rand(-a, a), rand(-a, a));
  }

  ctx.fillStyle = t.field;
  ctx.fillRect(-8, -8, W + 16, H + 16);
  if (surf.is3D) render3D(t);
  else render2D(t);

  // パーティクル
  for (const p of particles) {
    ctx.globalAlpha = Math.min(1, p.t * 2);
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
  }
  ctx.globalAlpha = 1;

  // ビネット(CRT効果ON時)
  if (settings.crt) ctx.drawImage(vigC, 0, FIELD_Y);

  // フロート文字
  ctx.textAlign = 'center';
  for (const f of floats) {
    ctx.globalAlpha = Math.min(1, f.t);
    ctx.fillStyle = f.col;
    ctx.font = (f.big ? "bold 24px" : "bold 14px") + " 'Courier New', monospace";
    ctx.fillText(f.txt, clamp(f.x, 40, W - 40), clamp(f.y, FIELD_Y + 16, H - 8));
  }
  ctx.globalAlpha = 1;

  renderHUD();
  renderOverlay();
  ctx.restore();
}

/* ---- 平面の描画 ---- */
function render2D(t) {
  ctx.drawImage(fieldC, 0, FIELD_Y);

  // 軌跡
  if (trail.length) {
    const pulse = 0.75 + 0.25 * Math.sin(blinkT * 12);
    ctx.globalAlpha = pulse;
    ctx.fillStyle = player.usedFast ? t.trailF : t.trailS;
    for (const c of trail) ctx.fillRect((c % GW) * CS, FIELD_Y + ((c / GW) | 0) * CS, CS, CS);
    ctx.globalAlpha = 1;
  }

  // 導火線
  if (fuse.lit && player.drawing && trail.length)
    drawFuse(surf.screenOf(trail[Math.min(Math.floor(fuse.pos), trail.length - 1)]));

  // SPARX
  for (const s of sparxes) { const p = surf.screenOf(s.c); drawSparx(p.x, p.y, s); }

  drawPlayer(t);

  // QIX(フィールド内にクリップ)
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, FIELD_Y, W, H - FIELD_Y);
  ctx.clip();
  for (const q of qixes) {
    for (let i = 0; i < q.segs.length; i++) {
      const s = q.segs[i];
      const al = (i + 1) / q.segs.length;
      const last = i === q.segs.length - 1;
      ctx.strokeStyle = qixStroke(s.h, 45 + al * 25, 0.2 + 0.8 * al);
      ctx.lineWidth = last ? 3 : 2;
      if (last) { ctx.shadowColor = qixStroke(s.h, 60, 0.9); ctx.shadowBlur = 8; }
      ctx.beginPath();
      ctx.moveTo(s.x1 * CS, FIELD_Y + s.y1 * CS);
      ctx.lineTo(s.x2 * CS, FIELD_Y + s.y2 * CS);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
  }
  ctx.restore();
}

/* ---- 立体面の描画 ----
   毎フレーム: 頂点を投影 → 裏向きのセルを捨てる → 色×陰影ごとにまとめて塗る */
const buckets = [];
for (let i = 0; i < NCOL * LV; i++) buckets.push([]);
let vxA = new Float32Array(0), vyA = new Float32Array(0), visA = new Uint8Array(0);

// 立体の輪郭のおおよその半径(画面上px)。裏側の敵の位置マーカーを置くのに使う
function rimRadius() { return surf.sph ? cam.F / Math.sqrt(cam.D * cam.D - 1) : 290; }

function render3D(t) {
  const S = surf, R = cam.R, D = cam.D, F = cam.F, cx = cam.cx, cy = cam.cy;
  // 星空
  ctx.fillStyle = '#ffffff';
  for (const s of STARS) {
    ctx.globalAlpha = 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(blinkT * 1.3 + s.ph));
    ctx.fillRect(s.x, s.y, s.r, s.r);
  }
  ctx.globalAlpha = 1;
  // 球の後ろにうっすら光の輪
  if (S.sph) {
    const rs = rimRadius();
    const g = ctx.createRadialGradient(cx, cy, rs * 0.9, cx, cy, rs * 1.12);
    g.addColorStop(0, shade(t.accent, 0.45));
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, rs * 1.12, 0, Math.PI * 2); ctx.fill();
  }

  if (vxA.length < S.nv) { vxA = new Float32Array(S.nv); vyA = new Float32Array(S.nv); }
  if (visA.length < S.N) visA = new Uint8Array(S.N);
  const [r0, r1, r2, r3, r4, r5, r6, r7, r8] = R;
  const vp = S.vpos;
  for (let v = 0, o = 0; v < S.nv; v++, o += 3) {
    const x = vp[o], y = vp[o + 1], z = vp[o + 2];
    const s = F / (D - (r6 * x + r7 * y + r8 * z));
    vxA[v] = cx + (r0 * x + r1 * y + r2 * z) * s;
    vyA[v] = cy - (r3 * x + r4 * y + r5 * z) * s;
  }
  // 光源をワールド座標へ(Rの転置を掛ける)
  const lx = r0 * LIGHT_V[0] + r3 * LIGHT_V[1] + r6 * LIGHT_V[2];
  const ly = r1 * LIGHT_V[0] + r4 * LIGHT_V[1] + r7 * LIGHT_V[2];
  const lz = r2 * LIGHT_V[0] + r5 * LIGHT_V[1] + r8 * LIGHT_V[2];

  for (const b of buckets) b.length = 0;
  const nor = S.nor, nc = S.nc, par = S.par;
  const sealed = state === 'clear';
  const trailCi = player.usedFast ? 4 : 5;
  for (let c = 0; c < S.N; c++) {
    const nx = nor[c * 3], ny = nor[c * 3 + 1], nz = nor[c * 3 + 2];
    // 裏向き判定: 法線・(カメラ位置 − セル位置) > 0 なら見えている
    if (D * (r6 * nx + r7 * ny + r8 * nz) - nc[c] <= 0) { visA[c] = 0; continue; }
    visA[c] = 1;
    const g = grid[c];
    let ci;
    if (g === OPEN) ci = sealed ? 2 : par[c];
    else if (g === TRAIL) ci = trailCi;
    else { const a = colA[c]; ci = a === 0 ? 3 : a === HOME_COL ? 6 : 6 + a + (par[c] ? 8 : 0); }
    const lit = nx * lx + ny * ly + nz * lz;
    const lvl = lit <= 0 ? 0 : Math.min(LV - 1, (lit * LV) | 0);
    buckets[ci * LV + lvl].push(c);
  }
  const Q = S.quad, K = 1.1; // K: 継ぎ目の隙間を消すため少し膨らませる
  for (let bi = 0; bi < buckets.length; bi++) {
    const arr = buckets[bi];
    if (!arr.length) continue;
    ctx.fillStyle = col3D[bi];
    ctx.beginPath();
    for (const c of arr) {
      const a = Q[c * 4], b = Q[c * 4 + 1], d = Q[c * 4 + 2], e = Q[c * 4 + 3];
      const mx = (vxA[a] + vxA[b] + vxA[d] + vxA[e]) * 0.25, my = (vyA[a] + vyA[b] + vyA[d] + vyA[e]) * 0.25;
      ctx.moveTo(mx + (vxA[a] - mx) * K, my + (vyA[a] - my) * K);
      ctx.lineTo(mx + (vxA[b] - mx) * K, my + (vyA[b] - my) * K);
      ctx.lineTo(mx + (vxA[d] - mx) * K, my + (vyA[d] - my) * K);
      ctx.lineTo(mx + (vxA[e] - mx) * K, my + (vyA[e] - my) * K);
      ctx.closePath();
    }
    ctx.fill();
  }

  // 導火線
  if (fuse.lit && player.drawing && trail.length) {
    const c = trail[Math.min(Math.floor(fuse.pos), trail.length - 1)];
    if (visA[c]) drawFuse(S.screenOf(c));
  }
  // SPARX(裏側にいるものは輪郭の外にマーカー)
  for (const s of sparxes) {
    const p = S.screenOf(s.c);
    if (visA[s.c]) drawSparx(p.x, p.y, s);
    else drawOffMarker(p, '#ffe25c', 5);
  }

  drawPlayer(t);

  // QIX: 腕は表面に沿った折れ線。見えている部分だけ描く
  for (const q of qixes) {
    for (let i = 0; i < q.segs.length; i++) {
      const s = q.segs[i];
      const al = (i + 1) / q.segs.length;
      const last = i === q.segs.length - 1;
      ctx.strokeStyle = qixStroke(s.h, 45 + al * 25, 0.2 + 0.8 * al);
      ctx.lineWidth = last ? 3 : 2;
      if (last) { ctx.shadowColor = qixStroke(s.h, 60, 0.9); ctx.shadowBlur = 8; }
      ctx.beginPath();
      let pen = false;
      for (const p of s.pts) {
        if (!visA[S.cellAt(p[0], p[1], p[2])]) { pen = false; continue; }
        const w = S.world(p), sp = projXYZ(w[0] * 1.012, w[1] * 1.012, w[2] * 1.012);
        if (pen) ctx.lineTo(sp.x, sp.y); else { ctx.moveTo(sp.x, sp.y); pen = true; }
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
    if (!visA[S.qixCell(q)]) drawOffMarker(S.qixScreen(q), qixStroke(q.hue, 62, 1), 9);
  }
}

// 裏側にいる敵の方向を、輪郭の外側に三角で示す
function drawOffMarker(p, col, sz) {
  let dx = p.x - cam.cx, dy = p.y - cam.cy;
  const l = Math.hypot(dx, dy);
  if (l < 1) { dx = 0; dy = 1; } else { dx /= l; dy /= l; }
  const r = rimRadius() + 18;
  const x = clamp(cam.cx + dx * r, 14, W - 14), y = clamp(cam.cy + dy * r, FIELD_Y + 14, H - 14);
  ctx.globalAlpha = 0.55 + 0.45 * Math.sin(blinkT * 8);
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(x + dx * sz, y + dy * sz);
  ctx.lineTo(x - dx * sz * 0.6 - dy * sz * 0.8, y - dy * sz * 0.6 + dx * sz * 0.8);
  ctx.lineTo(x - dx * sz * 0.6 + dy * sz * 0.8, y - dy * sz * 0.6 - dx * sz * 0.8);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
}

function renderHUD() {
  const t = theme();
  ctx.fillStyle = t.hud;
  ctx.fillRect(0, 0, W, FIELD_Y);
  ctx.fillStyle = shade(t.accent, 0.35);
  ctx.fillRect(0, FIELD_Y - 2, W, 2);

  // 左: スコア
  ctx.textAlign = 'left';
  ctx.fillStyle = '#8fa3d9';
  ctx.font = "bold 10px 'Courier New', monospace";
  ctx.fillText('SCORE', 10, 16);
  ctx.fillStyle = '#ffffff';
  ctx.font = "bold 17px 'Courier New', monospace";
  ctx.fillText(String(score).padStart(7, '0'), 10, 34);
  ctx.fillStyle = '#6d7ba8';
  ctx.font = "bold 11px 'Courier New', monospace";
  ctx.fillText('HI ' + String(Math.max(hiScore, score)).padStart(7, '0'), 10, 50);

  // 中央: 占領率
  const pct = percent(), tg = target();
  ctx.textAlign = 'center';
  ctx.fillStyle = pct >= tg ? '#7bffa0' : '#ffd76b';
  ctx.font = "bold 19px 'Courier New', monospace";
  ctx.fillText(pct.toFixed(1) + '%', W / 2, 24);
  // 進捗バー(目標位置に印)
  const bw = 150, bx = W / 2 - bw / 2, by = 31;
  ctx.fillStyle = '#1b2340';
  ctx.fillRect(bx, by, bw, 8);
  ctx.fillStyle = pct >= tg ? '#4be07f' : '#e0a83a';
  ctx.fillRect(bx, by, bw * clamp(pct / 100, 0, 1), 8);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(bx + bw * tg / 100 - 1, by - 2, 2, 12);
  ctx.fillStyle = '#6d7ba8';
  ctx.font = "bold 10px 'Courier New', monospace";
  ctx.fillText('TARGET ' + tg + '%', W / 2, 52);

  // 右: エリア・盤面・残機・難易度・ポーズボタン
  ctx.textAlign = 'right';
  ctx.fillStyle = '#8fa3d9';
  ctx.font = "bold 11px 'Courier New', monospace";
  ctx.fillText('AREA ' + level + ' ' + surf.key, W - 52, 16);
  for (let i = 0; i < Math.min(lives, 8); i++) {
    ctx.fillStyle = '#ff3b6b';
    drawDiamond(W - 58 - i * 13, 28, 5);
  }
  ctx.fillStyle = '#6d7ba8';
  ctx.font = "bold 10px 'Courier New', monospace";
  ctx.fillText(settings.diff, W - 52, 50);

  // ポーズボタン(タップ可)
  if (state === 'play' || state === 'ready' || state === 'pause') {
    ctx.fillStyle = 'rgba(60,80,140,.35)';
    ctx.fillRect(pauseRect.x, pauseRect.y, pauseRect.w, pauseRect.h);
    ctx.fillStyle = '#cdd8ff';
    if (state === 'pause') {
      ctx.beginPath();
      ctx.moveTo(pauseRect.x + 12, pauseRect.y + 9);
      ctx.lineTo(pauseRect.x + 27, pauseRect.y + 18);
      ctx.lineTo(pauseRect.x + 12, pauseRect.y + 27);
      ctx.closePath(); ctx.fill();
    } else {
      ctx.fillRect(pauseRect.x + 11, pauseRect.y + 9, 5, 18);
      ctx.fillRect(pauseRect.x + 21, pauseRect.y + 9, 5, 18);
    }
  }
}

function panel(x, y, w, h) {
  ctx.fillStyle = 'rgba(4, 6, 16, 0.88)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = shade(theme().accent, 0.7);
  ctx.lineWidth = 2;
  ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
}

function renderOverlay() {
  const t = theme();
  const blinkOn = Math.sin(blinkT * 5) > -0.2;
  ctx.textAlign = 'center';

  if ((state === 'play' || state === 'ready') && deathTimer > 0) {
    if (blinkOn) {
      ctx.fillStyle = '#ff5c8a';
      ctx.font = "bold 34px 'Courier New', monospace";
      ctx.fillText('MISS!', W / 2, H / 2);
    }
    return;
  }

  if (state === 'title') {
    panel(56, 130, W - 112, 580);
    ctx.fillStyle = t.accent;
    ctx.font = "bold 58px 'Courier New', monospace";
    ctx.fillText('QLAIM', W / 2 + 3, 222 + 3);
    ctx.fillStyle = '#ffffff';
    ctx.fillText('QLAIM', W / 2, 222);
    ctx.fillStyle = '#8fa3d9';
    ctx.font = "bold 17px 'Courier New', monospace";
    ctx.fillText('─ 陣取りアーケード v3 ─', W / 2, 258);

    ctx.font = "15px 'Courier New', monospace";
    ctx.fillStyle = '#cdd8ff';
    const lines = [
      '↑↓←→ / WASD : 移動',
      'Z or SPACE  : 速く引く (×1)',
      'X or SHIFT  : 遅く引く (×2)',
      '',
      '線で囲んで陣地を広げろ!',
      '立方体・球では 表面をぐるっと陣取り',
      'AREA 3 からは QIX 2体 ── 分断で即クリア',
      'QIX・SPARX・導火線に注意',
    ];
    lines.forEach((s, i) => ctx.fillText(s, W / 2, 296 + i * 24));

    // 盤面モード選択
    titleModeRect = { x: 84, y: 498, w: W - 168, h: 44 };
    ctx.fillStyle = 'rgba(90,120,220,.16)';
    ctx.fillRect(titleModeRect.x, titleModeRect.y, titleModeRect.w, titleModeRect.h);
    ctx.fillStyle = t.accent;
    ctx.font = "bold 17px 'Courier New', monospace";
    ctx.fillText('◀  ' + MODE_LABEL[settings.mode] + '  ▶', W / 2, 526);
    ctx.fillStyle = '#6d7ba8';
    ctx.font = "bold 11px 'Courier New', monospace";
    ctx.fillText('←→ で盤面をえらぶ', W / 2, 558);

    if (blinkOn) {
      ctx.fillStyle = '#ffd76b';
      ctx.font = "bold 18px 'Courier New', monospace";
      ctx.fillText('Z / SPACE / タップ でスタート', W / 2, 594);
    }
    // OPTIONS ボタン
    titleOptRect = { x: W / 2 - 110, y: 614, w: 220, h: 38 };
    ctx.strokeStyle = '#3a4a7a';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(titleOptRect.x, titleOptRect.y, titleOptRect.w, titleOptRect.h);
    ctx.fillStyle = '#8fa3d9';
    ctx.font = "bold 15px 'Courier New', monospace";
    ctx.fillText('OPTIONS  [X / O]', W / 2, 639);

    ctx.fillStyle = '#6d7ba8';
    ctx.font = "bold 13px 'Courier New', monospace";
    ctx.fillText(settings.mode + ' HI SCORE ' + String(hiScore).padStart(7, '0'), W / 2, 684);
    return;
  }

  if (state === 'options') {
    panel(60, 130, W - 120, 560);
    ctx.fillStyle = '#ffffff';
    ctx.font = "bold 28px 'Courier New', monospace";
    ctx.fillText('OPTIONS', W / 2, 182);

    optRects = [];
    const y0 = 240, dy = 58;
    OPT_ITEMS.forEach((it, i) => {
      const y = y0 + i * dy;
      optRects.push({ x: 76, y: y - 30, w: W - 152, h: 46, idx: i });
      const sel = i === optSel;
      if (sel) {
        ctx.fillStyle = 'rgba(90,120,220,.18)';
        ctx.fillRect(76, y - 30, W - 152, 46);
        ctx.fillStyle = t.accent;
        ctx.font = "bold 17px 'Courier New', monospace";
        ctx.textAlign = 'left';
        ctx.fillText('▶', 88, y);
      }
      ctx.textAlign = 'left';
      ctx.fillStyle = sel ? '#ffffff' : '#aab6dd';
      ctx.font = "bold 17px 'Courier New', monospace";
      ctx.fillText(it.label, 116, y);

      ctx.textAlign = 'right';
      if (it.k === '_back') {
        // 値なし
      } else if (it.min != null && it.max === 10) {
        // 音量バー
        const v = settings[it.k] | 0;
        const bw2 = 130, bx2 = W - 96 - bw2, by2 = y - 12;
        ctx.fillStyle = '#1b2340';
        ctx.fillRect(bx2, by2, bw2, 10);
        ctx.fillStyle = sel ? t.accent : '#5a6a9a';
        ctx.fillRect(bx2, by2, bw2 * v / 10, 10);
        ctx.fillStyle = sel ? '#ffffff' : '#aab6dd';
        ctx.fillText(String(v), W - 84, y);
      } else {
        let vs;
        if (it.bool) vs = settings[it.k] ? 'ON' : 'OFF';
        else if (it.vals) vs = it.k === 'diff' ? settings.diff : it.vals[settings[it.k] | 0];
        else vs = String(settings[it.k]);
        ctx.fillStyle = sel ? '#ffffff' : '#aab6dd';
        ctx.fillText('◀ ' + vs + ' ▶', W - 84, y);
      }
    });

    ctx.textAlign = 'center';
    ctx.fillStyle = '#6d7ba8';
    ctx.font = "bold 13px 'Courier New', monospace";
    ctx.fillText('↑↓ 選択 / ←→ 変更 / Z・ESC もどる', W / 2, 668);
    return;
  }

  if (state === 'ready') {
    if (deathTimer <= 0) {
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(0, FIELD_Y, W, H - FIELD_Y);
      ctx.fillStyle = t.accent;
      ctx.font = "bold 44px 'Courier New', monospace";
      ctx.fillText('AREA ' + level, W / 2, H / 2 - 40);
      ctx.fillStyle = '#cdd8ff';
      ctx.font = "bold 18px 'Courier New', monospace";
      ctx.fillText('── ' + surf.def.label + ' ──', W / 2, H / 2 - 6);
      if (blinkOn) {
        ctx.fillStyle = '#ffffff';
        ctx.font = "bold 22px 'Courier New', monospace";
        ctx.fillText('READY', W / 2, H / 2 + 30);
      }
      ctx.font = "bold 15px 'Courier New', monospace";
      let y = H / 2 + 68;
      if (surf.is3D) {
        ctx.fillStyle = '#8fa3d9';
        ctx.fillText('カメラが自機を追う ─ キーは画面の向き', W / 2, y);
        y += 24;
      }
      if (qixes.length > 1) {
        ctx.fillStyle = '#ffd76b';
        ctx.fillText('QIX 2体 ─ 分断で即クリア!', W / 2, y);
      }
    }
    return;
  }

  if (state === 'pause') {
    panel(180, 350, W - 360, 130);
    ctx.fillStyle = '#ffffff';
    ctx.font = "bold 26px 'Courier New', monospace";
    ctx.fillText('PAUSE', W / 2, 406);
    ctx.fillStyle = '#8fa3d9';
    ctx.font = "14px 'Courier New', monospace";
    ctx.fillText('P / タップ で再開', W / 2, 442);
    return;
  }

  if (state === 'clear') {
    panel(90, 300, W - 180, wasSplit ? 240 : 210);
    if (wasSplit) {
      ctx.fillStyle = t.accent;
      ctx.font = "bold 30px 'Courier New', monospace";
      ctx.fillText('QIX SPLIT!!', W / 2, 348);
      ctx.fillStyle = '#7bffa0';
      ctx.font = "bold 24px 'Courier New', monospace";
      ctx.fillText('AREA CLEAR!', W / 2, 384);
    } else {
      ctx.fillStyle = '#7bffa0';
      ctx.font = "bold 32px 'Courier New', monospace";
      ctx.fillText('AREA CLEAR!', W / 2, 356);
    }
    ctx.fillStyle = '#ffffff';
    ctx.font = "bold 17px 'Courier New', monospace";
    ctx.fillText('占領率 ' + percent().toFixed(1) + '%', W / 2, wasSplit ? 424 : 400);
    ctx.fillStyle = '#ffd76b';
    ctx.fillText('BONUS +' + lastBonus, W / 2, wasSplit ? 452 : 428);
    if (stTimer > 0.8 && blinkOn) {
      ctx.fillStyle = '#cdd8ff';
      ctx.font = "bold 15px 'Courier New', monospace";
      const nx = CONFIG.SURF[surfaceFor(level + 1)].label;
      ctx.fillText('Z / タップ で次のエリアへ (' + nx + ')', W / 2, wasSplit ? 508 : 478);
    }
    return;
  }

  if (state === 'over') {
    panel(90, 310, W - 180, 200);
    ctx.fillStyle = '#ff5c8a';
    ctx.font = "bold 34px 'Courier New', monospace";
    ctx.fillText('GAME OVER', W / 2, 366);
    ctx.fillStyle = '#ffffff';
    ctx.font = "bold 17px 'Courier New', monospace";
    ctx.fillText('SCORE ' + score, W / 2, 406);
    ctx.fillStyle = '#6d7ba8';
    ctx.fillText('HI ' + hiScore, W / 2, 432);
    if (stTimer > 0.8 && blinkOn) {
      ctx.fillStyle = '#cdd8ff';
      ctx.font = "bold 15px 'Courier New', monospace";
      ctx.fillText('Z / タップ でタイトルへ', W / 2, 478);
    }
  }
}

/* ---------------- メインループ ---------------- */
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  blinkT += dt;
  stTimer += dt;

  tickMeta(dt);
  if (state === 'play') update(dt);
  else {
    // タイトル/オプション/READYではQIXがアトラクト的に泳ぐ
    if (state === 'title' || state === 'options' || state === 'ready') updateQixes(dt);
    updateParticles(dt); updateFloats(dt);
  }

  render();
}

/* ---------------- キーボード ---------------- */
const KEYDIR = {
  ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
  w:'up', s:'down', a:'left', d:'right',
  W:'up', S:'down', A:'left', D:'right',
};
window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  Snd.ensure();

  if (k === 'm' || k === 'M') {
    const m = Snd.toggleMute();
    floats.push({ x: W / 2, y: H / 2, txt: m ? 'MUTE' : 'SOUND ON', t: 1.0, col: '#cdd8ff' });
    e.preventDefault(); return;
  }

  // OPTIONS画面の操作
  if (state === 'options') {
    if (k === 'ArrowUp'   || k === 'w' || k === 'W') { optSel = (optSel + OPT_ITEMS.length - 1) % OPT_ITEMS.length; Snd.blip(); }
    else if (k === 'ArrowDown' || k === 's' || k === 'S') { optSel = (optSel + 1) % OPT_ITEMS.length; Snd.blip(); }
    else if (k === 'ArrowLeft' || k === 'a' || k === 'A') adjustOpt(-1);
    else if (k === 'ArrowRight'|| k === 'd' || k === 'D') adjustOpt(1);
    else if (k === 'z' || k === 'Z' || k === ' ' || k === 'Enter') {
      if (OPT_ITEMS[optSel].k === '_back') closeOptions();
      else adjustOpt(1);
    }
    else if (k === 'Escape' || k === 'x' || k === 'X') closeOptions();
    e.preventDefault(); return;
  }

  // タイトル画面: ←→ で盤面モード切替
  if (state === 'title' && (KEYDIR[k] === 'left' || KEYDIR[k] === 'right')) {
    if (!e.repeat) cycleMode(KEYDIR[k] === 'left' ? -1 : 1);
    e.preventDefault(); return;
  }

  if (KEYDIR[k]) { pressDir(KEYDIR[k]); e.preventDefault(); return; }
  if (k === 'z' || k === 'Z' || k === ' ' || k === 'j') {
    held.fast = true;
    if (state !== 'play' && state !== 'ready' && state !== 'pause') onAction();
    e.preventDefault(); return;
  }
  if (k === 'x' || k === 'X' || k === 'Shift' || k === 'k') {
    held.slow = true;
    if (state === 'title') openOptions();
    else if (state !== 'play' && state !== 'ready' && state !== 'pause') onAction();
    e.preventDefault(); return;
  }
  if (k === 'o' || k === 'O') { if (state === 'title') openOptions(); return; }
  if (k === 'Enter') { if (state !== 'play' && state !== 'ready' && state !== 'pause') onAction(); return; }
  if (k === 'p' || k === 'P' || k === 'Escape') {
    if (state === 'play' || state === 'ready' || state === 'pause') togglePause();
    return;
  }
});
window.addEventListener('keyup', e => {
  const k = e.key;
  if (KEYDIR[k]) { releaseDir(KEYDIR[k]); return; }
  if (k === 'z' || k === 'Z' || k === ' ' || k === 'j') held.fast = false;
  if (k === 'x' || k === 'X' || k === 'Shift' || k === 'k') held.slow = false;
});
window.addEventListener('blur', () => { if (state === 'play' || state === 'ready') doPause(); });

/* ---------------- タッチ操作 ---------------- */
function bindHold(id, down, up) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('pointerdown', e => { e.preventDefault(); Snd.ensure(); down(); });
  const rel = e => { e.preventDefault(); up(); };
  el.addEventListener('pointerup', rel);
  el.addEventListener('pointercancel', rel);
  el.addEventListener('pointerleave', rel);
  el.addEventListener('contextmenu', e => e.preventDefault());
}
[['b-up','up'],['b-down','down'],['b-left','left'],['b-right','right']].forEach(([id, d]) => {
  bindHold(id, () => {
    if (state === 'title' && (d === 'left' || d === 'right')) { cycleMode(d === 'left' ? -1 : 1); return; }
    pressDir(d);
  }, () => releaseDir(d));
});
bindHold('b-fast', () => {
  held.fast = true;
  if (state !== 'play' && state !== 'ready' && state !== 'pause' && state !== 'options') onAction();
}, () => { held.fast = false; });
bindHold('b-slow', () => {
  held.slow = true;
  if (state === 'title') openOptions();
  else if (state !== 'play' && state !== 'ready' && state !== 'pause' && state !== 'options') onAction();
}, () => { held.slow = false; });

// キャンバス上のタップを状態別に振り分け
function canvasPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
function inRect(p, r) { return r && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }

cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  Snd.ensure();
  const p = canvasPos(e);

  if (state === 'title') {
    if (inRect(p, titleOptRect)) openOptions();
    else if (inRect(p, titleModeRect)) cycleMode(p.x < W / 2 ? -1 : 1);
    else startGame();
    return;
  }
  if (state === 'options') {
    const row = optRects.find(r => inRect(p, r));
    if (!row) return;
    optSel = row.idx;
    if (OPT_ITEMS[optSel].k === '_back') { closeOptions(); return; }
    adjustOpt(p.x < W / 2 ? -1 : 1); // 行の左半分で−、右半分で+
    return;
  }
  if (state === 'play' || state === 'ready') {
    if (inRect(p, pauseRect)) doPause();
    return;
  }
  if (state === 'pause') { doResume(); return; }
  onAction(); // clear / over
});

/* ---------------- 画面サイズ調整 ---------------- */
function fitCanvas() {
  const pad = document.getElementById('pad');
  const padH = (getComputedStyle(pad).display !== 'none') ? pad.offsetHeight + 8 : 0;
  const s = Math.min((window.innerWidth - 8) / W, (window.innerHeight - padH - 12) / H);
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
}
window.addEventListener('resize', fitCanvas);

/* ---------------- 起動 ---------------- */
applyTheme();
applyCrt();
initLevel(1);
Bgm.play('title'); // 最初の操作でAudioContextが起きたら鳴り始める
fitCanvas();
requestAnimationFrame(loop);
</script>
